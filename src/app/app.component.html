<div class="min-h-screen bg-slate-950 text-white">
  <!-- HEADER -->
  <header class="border-b border-white/10 bg-slate-950/95">
    <div
      class="mx-auto flex max-w-7xl items-center justify-between px-4 py-5 sm:px-6 lg:px-8"
    >
      <div>
        <h1
          class="text-xl font-black uppercase tracking-widest text-white sm:text-2xl"
        >
          Villainous
        </h1>

        <p
          class="mt-1 text-xs font-medium uppercase tracking-[0.25em] text-purple-400"
        >
          What Would You Do?
        </p>
      </div>

      <div class="hidden text-right sm:block">
        <p class="text-xs text-slate-500">Interactive Scenarios</p>

        <p class="text-sm font-semibold text-slate-300">Disney Villainous</p>
      </div>
    </div>
  </header>

  <nav class="border-b border-white/10 bg-slate-900">
    <div class="mx-auto flex max-w-7xl gap-3 px-4 py-4 sm:px-6 lg:px-8">
      <button
        type="button"
        (click)="showScenarios()"
        class="rounded-lg px-5 py-2 font-semibold transition"
        [class.bg-purple-600]="currentSection === 'scenarios'"
        [class.bg-slate-800]="currentSection !== 'scenarios'"
      >
        🎮 Scenari
      </button>

      <button
        type="button"
        (click)="showCatalog()"
        class="rounded-lg px-5 py-2 font-semibold transition"
        [class.bg-purple-600]="currentSection === 'catalog'"
        [class.bg-slate-800]="currentSection !== 'catalog'"
      >
        📚 Catalogo
      </button>
    </div>
  </nav>

  <!-- LISTA SCENARI -->
  @if (currentSection === "scenarios" && !currentScenario) {
    <app-scenario-list
      [scenarios]="scenarios"
      (scenarioSelected)="startScenario($event)"
    />
  }

  <!-- GIOCO -->
  @if (
    currentSection === "scenarios" &&
    currentScenario &&
    currentScene &&
    gameState
  ) {
    <app-game-view
      [scenario]="currentScenario"
      [scene]="currentScene"
      [gameState]="gameState"
      (choiceSelected)="selectChoice($event)"
      (restart)="restartScenario()"
      (back)="backToScenarios()"
    />
  }

  @if (currentSection === "catalog") {
    <app-catalog />
  }
</div>
