<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 p-4"
  (click)="close()"
>
  <div
    class="w-full max-w-2xl overflow-hidden rounded-2xl border border-white/10 bg-slate-900 shadow-2xl"
    (click)="$event.stopPropagation()"
  >
    <!-- HEADER -->
    <div
      class="flex items-center justify-between border-b border-white/10 px-5 py-4 sm:px-6"
    >
      <div>
        <h2 class="text-xl font-black text-white sm:text-2xl">
          {{ speedInfo.title }}
        </h2>

        <p class="mt-1 text-xs text-slate-500">
          {{ speedInfo.subtitle }}
        </p>
      </div>

      <button
        type="button"
        (click)="close()"
        aria-label="Chiudi"
        class="flex h-9 w-9 items-center justify-center rounded-full text-xl text-slate-400 transition hover:bg-white/10 hover:text-white"
      >
        ×
      </button>
    </div>

    <!-- CONTENUTO -->
    <div class="max-h-[75vh] overflow-y-auto px-5 py-6 sm:px-6">
      <div class="space-y-6 text-sm leading-7 text-slate-300 sm:text-base">
        <!-- INTRODUZIONE -->
        @for (paragraph of speedInfo.introduction; track $index) {
          <p [innerHTML]="paragraph"></p>
        }

        <!-- LIVELLI DI VELOCITÀ -->
        <div class="space-y-3">
          @for (level of speedInfo.levels; track level.id) {
            <div
              class="rounded-xl border p-4"
              [class]="getLevelClasses(level.id)"
            >
              <div class="flex items-center gap-3">
                <!-- INDICATORE COLORE -->
                <div
                  class="h-5 w-12 shrink-0 rounded-md"
                  [class.bg-red-500]="level.id === 'red'"
                  [class.bg-orange-500]="level.id === 'orange'"
                  [class.bg-yellow-400]="level.id === 'yellow'"
                  [class.bg-green-500]="level.id === 'green'"
                ></div>

                <!-- NOME LIVELLO -->
                <h3
                  class="font-black"
                  [class.text-red-400]="level.id === 'red'"
                  [class.text-orange-400]="level.id === 'orange'"
                  [class.text-yellow-300]="level.id === 'yellow'"
                  [class.text-green-400]="level.id === 'green'"
                >
                  {{ level.label }}
                </h3>
              </div>

              <!-- DESCRIZIONE -->
              <p class="mt-3 text-slate-300">
                {{ level.description }}
              </p>
            </div>
          }
        </div>

        <!-- NOTA -->
        <div class="rounded-xl border border-purple-500/20 bg-purple-500/5 p-4">
          <p
            class="text-sm leading-6 text-slate-300"
            [innerHTML]="speedInfo.note"
          ></p>
        </div>
      </div>
    </div>

    <!-- FOOTER -->
    <div class="border-t border-white/10 px-5 py-4 sm:px-6">
      <button
        type="button"
        (click)="close()"
        class="w-full rounded-lg bg-purple-600 px-4 py-3 text-sm font-bold text-white transition hover:bg-purple-500"
      >
        Chiudi
      </button>
    </div>
  </div>
</div>
