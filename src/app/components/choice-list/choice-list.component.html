<div class="mt-8 space-y-3">
  <p class="mb-4 text-xs font-bold uppercase tracking-[0.2em] text-slate-500">
    Cosa vuoi fare?
  </p>

  @for (choice of choices; track choice.choice.id) {
    @if (choice.available) {
      <button
        type="button"
        (click)="selectChoice(choice)"
        class="group flex w-full items-center justify-between rounded-xl border px-5 py-4 text-left transition"
        [class.border-purple-500]="choice.active"
        [class.bg-purple-950]="choice.active"
        [class.shadow-lg]="choice.active"
        [class.shadow-purple-950-30]="choice.active"
        [class.border-white-10]="!choice.active"
        [class.bg-slate-800]="!choice.active"
        [class.hover:border-purple-500-50]="!choice.active"
        [class.hover:bg-purple-950-30]="!choice.active"
      >
        <div>
          <span
            class="font-semibold"
            [class.text-white]="choice.active"
            [class.text-slate-200]="!choice.active"
          >
            {{ choice.choice.label }}
          </span>

          @if (choice.active) {
            <p class="mt-1 text-xs font-medium text-purple-300">
              Azione attiva: seleziona le carte da scartare
            </p>
          }
        </div>

        <span
          class="ml-4 text-purple-400 transition"
          [class.group-hover:translate-x-1]="!choice.active"
        >
          →
        </span>
      </button>
    } @else {
      <button
        type="button"
        disabled
        class="flex w-full cursor-not-allowed items-center justify-between rounded-xl border border-white/5 bg-slate-950 px-5 py-4 text-left opacity-50"
      >
        <div>
          <span class="font-semibold text-slate-500">
            🔒 {{ choice.choice.label }}
          </span>

          @if (choice.lockedMessage) {
            <p class="mt-1 text-xs text-slate-600">
              {{ choice.lockedMessage }}
            </p>
          }
        </div>
      </button>
    }
  }
</div>
