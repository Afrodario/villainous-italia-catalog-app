<section class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
  <div class="mb-8">
    <h2 class="text-2xl font-black uppercase tracking-wide text-white">
      Progressione Obiettivi
    </h2>

    <p class="mt-2 text-sm text-slate-400">
      Tieni traccia dell'avanzamento verso l'Obiettivo del tuo Cattivo.
    </p>
  </div>

  <div class="space-y-8">
    <div>
      <h3 class="mb-4 text-xl font-bold text-white">Capitan Uncino</h3>

      <app-villain-progress [progression]="captainHookProgression" />
    </div>

    <div>
      <h3 class="mb-4 text-xl font-bold text-white">Principe Giovanni</h3>

      <app-villain-progress [progression]="princeJohnProgression" />
    </div>
  </div>
</section>
