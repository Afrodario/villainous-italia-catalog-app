<article
  class="group overflow-hidden rounded-2xl border border-white/10 bg-slate-900 shadow-xl shadow-black/20 transition duration-300 hover:-translate-y-1 hover:border-purple-500/40 hover:shadow-purple-950/20"
>

  <!-- IMMAGINE -->
  <div
    class="relative aspect-[16/9] overflow-hidden bg-slate-800"
  >

    <img
      [src]="scenario.coverImage"
      [alt]="scenario.title"
      class="h-full w-full object-cover transition duration-500 group-hover:scale-105"
    >

    <div
      class="absolute inset-0 bg-gradient-to-t from-slate-950 via-transparent to-transparent"
    ></div>

    <div
      class="absolute left-4 top-4"
    >

      <span
        class="rounded-full bg-black/60 px-3 py-1 text-xs font-bold uppercase tracking-wider text-white backdrop-blur-sm"
      >
        Scenario
      </span>

    </div>

  </div>


  <!-- CONTENUTO -->
  <div
    class="p-6"
  >

    <h4
      class="text-2xl font-black text-white"
    >
      {{ scenario.title }}
    </h4>


    <p
      class="mt-3 min-h-[3rem] text-sm leading-6 text-slate-400"
    >
      {{ scenario.description }}
    </p>


    <div
      class="my-5 h-px bg-white/10"
    ></div>


    <!-- FOOTER -->
    <div
      class="flex items-center justify-between gap-4"
    >

      <div>

        <p
          class="text-xs uppercase tracking-wider text-slate-500"
        >
          Cattivo
        </p>

        <p
          class="mt-1 font-bold text-purple-300"
        >
          {{ scenario.villain }}
        </p>

      </div>


      <button
        type="button"
        (click)="startScenario()"
        class="rounded-xl bg-purple-600 px-5 py-3 text-sm font-bold text-white shadow-lg shadow-purple-950/30 transition hover:bg-purple-500 focus:outline-none focus:ring-2 focus:ring-purple-400 focus:ring-offset-2 focus:ring-offset-slate-900"
      >
        Inizia
      </button>

    </div>

  </div>

</article>
