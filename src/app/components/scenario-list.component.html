<main class="mx-auto max-w-7xl px-4 py-10 sm:px-6 sm:py-14 lg:px-8">
  <!-- HERO -->
  <section class="mx-auto max-w-3xl text-center">
    <span
      class="inline-flex rounded-full border border-purple-500/30 bg-purple-500/10 px-4 py-1.5 text-xs font-bold uppercase tracking-[0.2em] text-purple-300"
    >
      Interactive Villainous
    </span>

    <h2
      class="mt-6 text-4xl font-black tracking-tight text-white sm:text-5xl lg:text-6xl"
    >
      What Would You Do?
    </h2>

    <p
      class="mx-auto mt-5 max-w-2xl text-base leading-7 text-slate-400 sm:text-lg"
    >
      Scegli uno scenario, affronta una situazione di gioco e decidi quale
      sarebbe la tua prossima mossa.
    </p>
  </section>

  <!-- SCENARI -->
  <section class="mt-12">
    <div class="mb-6 flex items-end justify-between">
      <div>
        <h3 class="text-2xl font-bold text-white">Scegli uno scenario</h3>

        <p class="mt-1 text-sm text-slate-500">
          Ogni scelta può cambiare il corso della partita.
        </p>
      </div>

      <span
        class="hidden rounded-full bg-slate-800 px-3 py-1 text-xs font-semibold text-slate-400 sm:block"
      >
        {{ scenarios.length }} scenari
      </span>
    </div>

    <!-- GRID -->
    <div class="grid grid-cols-1 gap-6 md:grid-cols-2 xl:grid-cols-3">
      @for (scenario of scenarios; track scenario.id) {
        <app-scenario-card
          [scenario]="scenario"
          (start)="selectScenario($event)"
        />
      }
    </div>
  </section>
</main>
