<section class="rounded-2xl border border-white/10 bg-slate-900 p-5 sm:p-6">
  <!-- HEADER -->

  <div class="mb-5">
    <p class="text-xs font-bold uppercase tracking-[0.2em] text-slate-500">
      Villain Deck
    </p>

    <h3 class="mt-1 text-lg font-black text-white">Mazzo Cattivo</h3>
  </div>

  <!-- MAZZO -->

  <button
    type="button"
    (click)="draw()"
    [disabled]="cardCount === 0"
    class="group mx-auto block"
    [class.cursor-pointer]="cardCount > 0"
    [class.cursor-not-allowed]="cardCount === 0"
  >
    <div
      class="relative h-48 w-32 rounded-xl border border-purple-500/30 bg-gradient-to-br from-purple-950 via-slate-900 to-black shadow-xl shadow-purple-950/30 transition duration-300 sm:h-56 sm:w-36"
      [class.group-hover:-translate-y-2]="cardCount > 0"
      [class.group-hover:shadow-purple-700-30]="cardCount > 0"
    >
      <!-- EFFETTO BORDO -->

      <div
        class="absolute inset-2 rounded-lg border border-purple-500/20"
      ></div>

      <!-- CONTENUTO -->

      <div
        class="flex h-full flex-col items-center justify-center px-3 text-center"
      >
        <span class="text-4xl"> 🐍 </span>

        <p
          class="mt-3 text-xs font-black uppercase tracking-[0.15em] text-purple-300"
        >
          Jafar
        </p>

        <p
          class="mt-1 text-[10px] font-bold uppercase tracking-widest text-purple-500/70"
        >
          Villain Deck
        </p>
      </div>
    </div>
  </button>

  <!-- NUMERO CARTE -->

  <div class="mt-5 text-center">
    <p class="text-3xl font-black text-purple-400">
      {{ cardCount }}
    </p>

    <p
      class="mt-1 text-xs font-semibold uppercase tracking-wider text-slate-500"
    >
      carte nel mazzo
    </p>
  </div>

  <!-- ISTRUZIONE -->

  @if (cardCount > 0) {
    <p class="mt-4 text-center text-xs text-slate-600">
      Clicca sul mazzo per pescare
    </p>

  } @else {
    <p class="mt-4 text-center text-xs font-semibold text-red-400">
      Il mazzo è vuoto
    </p>
  }
</section>
