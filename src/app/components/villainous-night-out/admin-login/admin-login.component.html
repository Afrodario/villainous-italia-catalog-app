<div
  class="mx-auto w-full max-w-md rounded-2xl border border-gray-700 bg-gray-900 p-6 shadow-xl"
>
  <div class="mb-6 text-center">
    <div class="mb-3 text-4xl">🔐</div>

    <h2 class="text-xl font-black text-white">Accesso amministratore</h2>

    <p class="mt-2 text-sm text-gray-400">
      Accedi per gestire i giocatori di Villainous Night Out.
    </p>
  </div>

  <form (ngSubmit)="onSubmit()" class="space-y-4">
    <!-- Email -->
    <div>
      <label
        for="admin-email"
        class="mb-2 block text-sm font-bold text-gray-300"
      >
        Email
      </label>

      <input
        id="admin-email"
        type="email"
        name="email"
        [(ngModel)]="email"
        required
        autocomplete="username"
        placeholder="La tua email"
        class="w-full rounded-lg border border-gray-700 bg-gray-800 px-4 py-3 text-sm text-white outline-none transition placeholder:text-gray-500 focus:border-purple-500"
      />
    </div>

    <!-- Password -->
    <div>
      <label
        for="admin-password"
        class="mb-2 block text-sm font-bold text-gray-300"
      >
        Password
      </label>

      <input
        id="admin-password"
        type="password"
        name="password"
        [(ngModel)]="password"
        required
        autocomplete="current-password"
        placeholder="La tua password"
        class="w-full rounded-lg border border-gray-700 bg-gray-800 px-4 py-3 text-sm text-white outline-none transition placeholder:text-gray-500 focus:border-purple-500"
      />
    </div>

    <!-- Errore -->
    @if (errorMessage) {
      <div class="rounded-lg border border-red-500/30 bg-red-500/10 p-3">
        <p class="text-sm text-red-300">
          {{ errorMessage }}
        </p>
      </div>
    }

    <!-- Pulsante -->
    <button
      type="submit"
      [disabled]="isLoading || !email || !password"
      class="w-full rounded-lg bg-purple-600 px-4 py-3 text-sm font-bold text-white transition hover:bg-purple-500 disabled:cursor-not-allowed disabled:opacity-50"
    >
      {{ isLoading ? "Accesso in corso..." : "Accedi" }}
    </button>
  </form>
</div>
